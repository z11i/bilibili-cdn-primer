name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-unsigned
          path: dist/
