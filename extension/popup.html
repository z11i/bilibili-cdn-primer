<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>视频预热</title>
<link rel="stylesheet" href="popup.css"><body>
<header><img src="icons/icon-48.png" width="40" height="40" alt=""><div><h1 data-i18n="appTitle">视频预热</h1><p data-i18n="appSubtitle">哔哩哔哩 CDN Primer</p></div><span id="version"></span></header>
<label class="switch"><span data-i18n="enabled">启用预热</span><input type="checkbox" id="enabled" role="switch"></label>
<p id="status" role="status" data-i18n="waitingStatus">正在读取播放状态…</p>
<dl id="details"></dl>
<details><summary data-i18n="settings">预热设置</summary>
<form id="settings">
<label><span data-i18n="language"></span><select id="language"><option value="auto" data-i18n="autoLanguage"></option><option value="zh_CN">简体中文</option><option value="en">English</option></select></label>
<label><span data-i18n="leadSeconds"></span><input id="leadSeconds" type="number" min="0" max="300" step="1"></label>
<label><span data-i18n="windowSeconds"></span><input id="windowSeconds" type="number" min="5" max="600" step="1"></label>
<label><span data-i18n="primeSeconds"></span><input id="primeSeconds" type="number" min="0.1" max="10" step="0.1"></label>
<label><span data-i18n="settleSeconds"></span><input id="settleSeconds" type="number" min="0" max="120" step="1"></label>
<label><span data-i18n="fetchMarginSeconds"></span><input id="fetchMarginSeconds" type="number" min="0" max="30" step="1"></label>
<label><span data-i18n="cadenceSeconds"></span><input id="cadenceSeconds" type="number" min="0.5" max="10" step="0.5"></label>
<label><span data-i18n="gapSeconds"></span><input id="gapSeconds" type="number" min="0" max="10" step="0.1"></label>
<label><span data-i18n="maxPrimeMiB"></span><input id="maxPrimeMiB" type="number" min="0.1" max="16" step="0.1"></label>
<label><span data-i18n="budgetMiB"></span><input id="budgetMiB" type="number" min="1" max="256" step="1"></label>
<label><span data-i18n="minBufferSeconds"></span><input id="minBufferSeconds" type="number" min="0" max="60" step="1"></label>
<label><span data-i18n="cdn"></span><select id="cdn"><option value="follow" data-i18n="cdnFollow"></option><option value="gcore" data-i18n="cdnGcore"></option><option value="akamai" data-i18n="cdnAkamai"></option></select></label>
<label class="check"><input id="primeWhilePaused" type="checkbox"><span data-i18n="primeWhilePaused"></span></label>
<label class="check"><input id="primeHidden" type="checkbox"><span data-i18n="primeHidden"></span></label>
<button class="primary" type="submit" data-i18n="save">保存设置</button>
</form></details>
<details id="diagnostics"><summary data-i18n="details">诊断详情</summary><dl id="detectionDetails"></dl><button id="export" data-i18n="export">导出诊断</button></details>
<p id="feedback" role="status"></p>
<footer><a href="privacy.html" target="_blank" rel="noopener" data-i18n="privacy">隐私说明</a></footer>
<script src="core.js"></script><script src="i18n.js"></script><script src="popup.js"></script>
</body></html>
